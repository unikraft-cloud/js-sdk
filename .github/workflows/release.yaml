name: release

# Publishes the package to npm. The release channel maps to an npm dist-tag and
# to a version shape (the sync workflow is what moves the version forward):
#   prod-stable  -> latest, stable versions      (0.1.1)
#   prod-staging -> next,   -next.N prereleases  (0.1.1-next.0)
#
# Pushes that do not change the version (docs, CI, refactors) are skipped rather
# than failed, since npm rejects republishing an existing version.
#
# Authentication uses npm trusted publishing (OIDC): npm exchanges the GitHub
# Actions ID token for a short-lived publish credential, so no long-lived
# NPM_TOKEN secret is involved. The trusted publisher registered on npmjs.com
# must name this repository and this workflow file (.github/workflows/
# release.yaml); renaming or moving this file breaks publishing until the npm
# side is updated to match.
on:
  push:
    branches:
    - prod-stable
    - prod-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    # Trusted publishing requires npm >= 11.5.1, which is newer than the npm
    # bundled with some Node 24 patch releases.
    - name: Update npm
      run: npm install -g npm@latest

    - name: Resolve release
      id: release
      run: |
        name=$(node -p 'require("./package.json").name')
        version=$(node -p 'require("./package.json").version')

        if [ "${{ github.ref_name }}" = "prod-stable" ]; then
          dist_tag=latest
        else
          dist_tag=next
        fi

        {
          echo "name=$name"
          echo "version=$version"
          echo "dist_tag=$dist_tag"
        } >> "$GITHUB_OUTPUT"

        # Nothing to do when this version is already on the registry. Checked
        # before the shape guard below so that pre-existing versions predating
        # the -next scheme skip cleanly instead of failing.
        if npm view "$name@$version" version >/dev/null 2>&1; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$name@$version is already published; skipping release."
          exit 0
        fi
        echo "publish=true" >> "$GITHUB_OUTPUT"

        # Never let `latest` point at a prerelease, or `next` at a stable
        # version that prod-stable is supposed to own.
        case "$dist_tag:$version" in
        latest:*-*)
          echo "::error::prod-stable must publish a stable version, got $version"
          exit 1
          ;;
        next:*-next.*) ;;
        next:*)
          echo "::error::prod-staging must publish a -next.N prerelease, got $version"
          exit 1
          ;;
        esac

    - name: Install dependencies
      if: steps.release.outputs.publish == 'true'
      run: npm ci

    - name: Build
      if: steps.release.outputs.publish == 'true'
      run: npm run build

    - name: Test
      if: steps.release.outputs.publish == 'true'
      run: npm run test

    # Provenance attestations are generated automatically when publishing from
    # a public repository via trusted publishing, so --provenance is implied.
    # --access comes from publishConfig in package.json.
    - name: Publish to npm
      if: steps.release.outputs.publish == 'true'
      run: npm publish --tag ${{ steps.release.outputs.dist_tag }}
