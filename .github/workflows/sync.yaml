name: sync

on:
  workflow_dispatch:
    inputs:
      channel:
        description: The release channel (OpenAPI spec branch) to sync from.
        required: true
        default: prod-staging
        type: choice
        options:
        - prod-stable
        - prod-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.channel }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Generate SDK from the OpenAPI spec
      run: make generate CHANNEL=${{ inputs.channel }}

    - name: Show diff
      run: git --no-pager diff --stat

    - name: Create pull request
      uses: peter-evans/create-pull-request@v6
      with:
        base: ${{ inputs.channel }}
        branch: sync/${{ inputs.channel }}
        commit-message: "chore: Update SDK from OpenAPI spec"
        title: "chore: Update SDK from OpenAPI spec (${{ inputs.channel }})"
        body: |
          Automated regeneration of the plumbing client from the
          `${{ inputs.channel }}` OpenAPI specification.
        author: Unikraft Bot <monkey@unikraft.io>
        committer: Unikraft Bot <monkey@unikraft.io>
        signoff: true
        add-paths: |
          src/api
