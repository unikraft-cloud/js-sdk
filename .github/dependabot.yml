version: 2

updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  groups:
    npm-deps:
      applies-to: version-updates
      patterns:
      - '*'
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'

- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  groups:
    github-deps:
      applies-to: version-updates
      patterns:
      - '*'
    github-security:
      applies-to: security-updates
      patterns:
      - '*'
